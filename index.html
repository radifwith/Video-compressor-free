<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Compress</title>
<style>
  :root{
    --bg:#0d0f12;
    --panel:#16191d;
    --line:#242830;
    --text:#e8eaed;
    --sub:#8a9099;
    --accent:#ffb020;
    --ok:#3ddc84;
    --err:#ff5c5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 18px 60px;
  }
  .wrap{width:100%; max-width:420px;}

  /* ---------- Drop zone ---------- */
  .drop{
    border:1.5px dashed var(--line);
    border-radius:18px;
    background:var(--panel);
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .drop:active{background:#1b1f24;}
  .drop svg{width:52px;height:52px;color:var(--sub);}
  input[type=file]{display:none;}

  /* ---------- Panel ---------- */
  .panel{display:none;}
  .panel.show{display:block;}

  video{
    width:100%;
    border-radius:16px;
    border:1px solid var(--line);
    background:#000;
    margin-bottom:16px;
    max-height:42vh;
  }

  .preview-compare{
    display:none;
    gap:8px;
    margin-bottom:16px;
  }
  .preview-compare.show{display:grid; grid-template-columns:1fr 1fr;}
  .preview-compare video{margin-bottom:0; max-height:22vh;}
  .preview-compare .cap{
    text-align:center;
    font-size:10.5px;
    color:var(--sub);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-top:6px;
  }

  /* ---------- Option rows ---------- */
  .row{
    display:flex;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 15px;
    margin-bottom:9px;
  }
  .row svg{width:18px;height:18px;color:var(--sub); flex-shrink:0;}
  .row .label{flex:1; margin-left:12px; font-size:13px; color:var(--sub);}

  select, input[type=number], input[type=text]{
    background:transparent;
    color:var(--text);
    border:none;
    font-size:13.5px;
    font-weight:600;
    text-align:right;
    -webkit-appearance:none;
    appearance:none;
    max-width:120px;
  }
  select:focus, input:focus{outline:none;}
  option{background:var(--panel); color:var(--text);}

  input[type=number]{
    width:70px;
  }
  .unit{font-size:12px; color:var(--sub); margin-left:4px;}

  .sub-row{
    display:none;
    padding:0 15px 4px 45px;
  }
  .sub-row.show{display:block;}

  /* ---------- Action button ---------- */
  .go{
    width:100%;
    margin-top:10px;
    padding:16px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:#1a1300;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
  }
  .go:active{transform:scale(0.98);}
  .go svg{width:19px;height:19px;}
  .go:disabled{opacity:.45;}

  /* ---------- Progress ---------- */
  .progress-wrap{display:none; margin-top:16px;}
  .progress-wrap.show{display:block;}
  .bar-track{
    width:100%;
    height:6px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    border-radius:3px;
    transition:width .25s ease;
  }
  .bar-fill.indeterminate{
    width:30% !important;
    animation:slide 1.1s ease-in-out infinite;
  }
  @keyframes slide{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(340%);}
  }
  .progress-label{
    text-align:center;
    font-size:12px;
    color:var(--sub);
    margin-top:9px;
    font-variant-numeric:tabular-nums;
  }
  .cancel-link{
    display:block;
    text-align:center;
    font-size:12px;
    color:var(--sub);
    text-decoration:underline;
    margin-top:10px;
    cursor:pointer;
  }

  /* ---------- Error ---------- */
  .error-wrap{display:none; margin-top:16px; text-align:center;}
  .error-wrap.show{display:block;}
  .error-wrap svg{width:32px;height:32px;color:var(--err); margin-bottom:8px;}
  .error-msg{font-size:13px; color:var(--err); margin-bottom:8px; line-height:1.5;}
  .error-detail{
    font-size:10.5px;
    color:var(--sub);
    font-family:'SFMono-Regular',Consolas,monospace;
    margin-bottom:14px;
    word-break:break-all;
    max-height:60px;
    overflow-y:auto;
    background:var(--panel);
    border-radius:8px;
    padding:8px 10px;
    text-align:left;
  }
  .error-detail:empty{display:none; margin-bottom:0;}
  .retry-btn{
    padding:11px 22px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel);
    color:var(--text);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }

  /* ---------- Done ---------- */
  .done-wrap{display:none; text-align:center; margin-top:14px;}
  .done-wrap.show{display:flex; flex-direction:column; align-items:center;}
  .size-compare{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--sub);
    font-size:13px;
    margin-bottom:16px;
    font-variant-numeric:tabular-nums;
  }
  .size-compare b{color:var(--ok); font-size:15px;}
  .size-compare svg{width:15px;height:15px;}

  .btn-row{display:flex; gap:12px; width:100%;}
  .btn{
    flex:1;
    aspect-ratio:1;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text);
  }
  .btn:active{transform:scale(0.94);}
  .btn svg{width:23px;height:23px;}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#1a1300;}

  .again{
    margin:20px auto 0;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--sub);
  }
  .again svg{width:17px;height:17px;}
</style>
</head>
<body>

<div class="wrap">

  <label class="drop" id="dropZone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
      <polygon points="23 7 16 12 23 17 23 7"/>
      <rect x="1" y="5" width="15" height="14" rx="2"/>
    </svg>
    <input type="file" id="fileInput" accept="video/*">
  </label>

  <div class="panel" id="panel">
    <video id="preview" controls playsinline></video>

    <div class="preview-compare" id="compareWrap">
      <div>
        <video id="beforeVideo" controls playsinline muted></video>
        <div class="cap">Before</div>
      </div>
      <div>
        <video id="afterVideo" controls playsinline muted></video>
        <div class="cap">After</div>
      </div>
    </div>

    <!-- Quality -->
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">Quality</span>
      <select id="qualitySelect">
        <option value="high">High</option>
        <option value="balanced" selected>Balanced</option>
        <option value="low">Low</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="sub-row" id="crfRow">
      <input type="number" id="crfInput" min="0" max="51" value="26" style="width:100%; text-align:left;">
      <span class="unit">CRF (0=best, 51=smallest)</span>
    </div>

    <!-- Target size -->
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">Target size</span>
      <input type="number" id="targetSize" placeholder="Auto" min="1">
      <span class="unit">MB</span>
    </div>

    <!-- Resolution -->
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span class="label">Resolution</span>
      <select id="resSelect">
        <option value="original">Original</option>
        <option value="1080" selected>1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
        <option value="240">240p</option>
        <option value="180">180p</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="sub-row" id="resCustomRow">
      <input type="number" id="resCustomInput" placeholder="Height" min="16" style="width:100%; text-align:left;">
      <span class="unit">px height</span>
    </div>

    <!-- FPS -->
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">FPS</span>
      <select id="fpsSelect">
        <option value="original" selected>Original</option>
        <option value="60">60</option>
        <option value="30">30</option>
        <option value="24">24</option>
        <option value="15">15</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="sub-row" id="fpsCustomRow">
      <input type="number" id="fpsCustomInput" placeholder="FPS" min="1" max="120" style="width:100%; text-align:left;">
      <span class="unit">frames/sec</span>
    </div>

    <!-- Format -->
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">Format</span>
      <select id="formatSelect">
        <option value="mp4" selected>MP4</option>
      </select>
    </div>

    <button class="go" id="goBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Compress
    </button>

    <div class="progress-wrap" id="progressWrap">
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      <div class="progress-label" id="progressLabel">Loading engine…</div>
      <div class="cancel-link" id="cancelLink">Cancel</div>
    </div>

    <div class="error-wrap" id="errorWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01" stroke-linecap="round"/></svg>
      <div class="error-msg" id="errorMsg">Something went wrong.</div>
      <div class="error-detail" id="errorDetail"></div>
      <button class="retry-btn" id="retryBtn">Try again</button>
    </div>

    <div class="done-wrap" id="doneWrap">
      <div class="size-compare">
        <span id="origSize">—</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <b id="newSize">—</b>
      </div>
      <div class="btn-row">
        <div class="btn btn-primary" id="downloadBtn" title="Download">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="btn" id="shareBtn" title="Share">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke-linecap="round"/></svg>
        </div>
      </div>
    </div>

    <div class="again" id="againBtn" title="New">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16m0 5v-5h5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

</div>

<script type="module">
import { FFmpeg } from "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile, toBlobURL } from "https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js";

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const panel = document.getElementById('panel');
const preview = document.getElementById('preview');
const compareWrap = document.getElementById('compareWrap');
const beforeVideo = document.getElementById('beforeVideo');
const afterVideo = document.getElementById('afterVideo');

const qualitySelect = document.getElementById('qualitySelect');
const crfRow = document.getElementById('crfRow');
const crfInput = document.getElementById('crfInput');
const targetSize = document.getElementById('targetSize');
const resSelect = document.getElementById('resSelect');
const resCustomRow = document.getElementById('resCustomRow');
const resCustomInput = document.getElementById('resCustomInput');
const fpsSelect = document.getElementById('fpsSelect');
const fpsCustomRow = document.getElementById('fpsCustomRow');
const fpsCustomInput = document.getElementById('fpsCustomInput');
const formatSelect = document.getElementById('formatSelect');

const goBtn = document.getElementById('goBtn');
const progressWrap = document.getElementById('progressWrap');
const barFill = document.getElementById('barFill');
const progressLabel = document.getElementById('progressLabel');
const cancelLink = document.getElementById('cancelLink');
const errorWrap = document.getElementById('errorWrap');
const errorMsg = document.getElementById('errorMsg');
const errorDetail = document.getElementById('errorDetail');
const retryBtn = document.getElementById('retryBtn');
const doneWrap = document.getElementById('doneWrap');
const origSizeEl = document.getElementById('origSize');
const newSizeEl = document.getElementById('newSize');
const downloadBtn = document.getElementById('downloadBtn');
const shareBtn = document.getElementById('shareBtn');
const againBtn = document.getElementById('againBtn');

let inputFile = null;
let outputBlob = null;
let outputUrl = null;
let outputName = 'compressed.mp4';
let ffmpeg = null;
let loadPromise = null;
let cancelled = false;

// ---------- Option visibility toggles ----------
qualitySelect.addEventListener('change', () => {
  crfRow.classList.toggle('show', qualitySelect.value === 'custom');
});
resSelect.addEventListener('change', () => {
  resCustomRow.classList.toggle('show', resSelect.value === 'custom');
});
fpsSelect.addEventListener('change', () => {
  fpsCustomRow.classList.toggle('show', fpsSelect.value === 'custom');
});

// ---------- File select ----------
fileInput.addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
});

function loadFile(file) {
  inputFile = file;
  dropZone.style.display = 'none';
  panel.classList.add('show');
  preview.src = URL.createObjectURL(file);
  preview.style.display = '';
  compareWrap.classList.remove('show');
  resetPanelState();
}

function resetPanelState() {
  doneWrap.classList.remove('show');
  progressWrap.classList.remove('show');
  errorWrap.classList.remove('show');
  goBtn.style.display = 'flex';
  goBtn.disabled = false;
}

function fmtSize(bytes) {
  if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + 'MB';
  return Math.round(bytes / 1024) + 'KB';
}

function setIndeterminate(on) {
  barFill.classList.toggle('indeterminate', on);
  if (on) barFill.style.width = '';
}

function showError(msg, detail) {
  progressWrap.classList.remove('show');
  errorMsg.textContent = msg;
  errorDetail.textContent = detail || '';
  errorWrap.classList.add('show');
  goBtn.style.display = 'none';
}

// ---------- FFmpeg loading with timeout + retry ----------
async function ensureFFmpegLoaded() {
  if (ffmpeg && ffmpeg.loaded) return;

  if (!loadPromise) {
    loadPromise = (async () => {
      const baseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm";
      ffmpeg = new FFmpeg();

      ffmpeg.on('log', ({ message }) => {
        console.log('[ffmpeg]', message);
      });

      ffmpeg.on('progress', ({ progress }) => {
        if (progress >= 0 && progress <= 1) {
          setIndeterminate(false);
          const pct = Math.round(progress * 100);
          barFill.style.width = pct + '%';
          progressLabel.textContent = pct + '%';
        }
      });

      const timeoutMs = 45000;
      const withTimeout = (p, ms, label) => Promise.race([
        p,
        new Promise((_, rej) => setTimeout(() => rej(new Error('TIMEOUT:' + label)), ms))
      ]);

      const coreURL = await withTimeout(
        toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
        timeoutMs, 'core-js'
      );
      const wasmURL = await withTimeout(
        toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
        timeoutMs, 'core-wasm'
      );

      await withTimeout(
        ffmpeg.load({ coreURL, wasmURL }),
        timeoutMs, 'engine-init'
      );
    })();
  }

  try {
    await loadPromise;
  } catch (err) {
    loadPromise = null;
    ffmpeg = null;
    throw err;
  }
}

// ---------- Build ffmpeg args from options ----------
function buildArgs(inName, outName) {
  const args = ['-i', inName];

  // Resolution
  if (resSelect.value === 'custom') {
    const h = parseInt(resCustomInput.value);
    if (h && h > 0) args.push('-vf', `scale=-2:${h}`);
  } else if (resSelect.value !== 'original') {
    args.push('-vf', `scale=-2:${resSelect.value}`);
  }

  // FPS
  if (fpsSelect.value === 'custom') {
    const f = parseInt(fpsCustomInput.value);
    if (f && f > 0) args.push('-r', String(f));
  } else if (fpsSelect.value !== 'original') {
    args.push('-r', fpsSelect.value);
  }

  // Codec + quality (MP4/H.264 only — reliable & fast in WASM)
  args.push('-c:v', 'libx264', '-pix_fmt', 'yuv420p');

  let crf;
  if (qualitySelect.value === 'custom') {
    const c = parseInt(crfInput.value);
    crf = (c >= 0 && c <= 51) ? String(c) : '26';
  } else if (qualitySelect.value === 'high') {
    crf = '20';
  } else if (qualitySelect.value === 'low') {
    crf = '32';
  } else {
    crf = '26'; // balanced
  }

  const useTargetSize = targetSize.value && parseFloat(targetSize.value) > 0;
  if (useTargetSize) {
    args.push('-b:v', '__TARGET_BITRATE__', '-maxrate', '__TARGET_BITRATE__', '-bufsize', '__TARGET_BUFSIZE__');
  } else {
    args.push('-crf', crf);
  }

  args.push('-preset', 'ultrafast');
  args.push('-c:a', 'aac', '-b:a', '128k');
  args.push('-movflags', '+faststart');
  args.push(outName);
  return args;
}

// ---------- Run compression ----------
goBtn.addEventListener('click', runCompression);
retryBtn.addEventListener('click', runCompression);

async function runCompression() {
  if (!inputFile) return;
  cancelled = false;

  goBtn.disabled = true;
  goBtn.style.display = 'none';
  errorWrap.classList.remove('show');
  doneWrap.classList.remove('show');
  progressWrap.classList.add('show');
  setIndeterminate(true);
  progressLabel.textContent = 'Loading engine…';

  const inName = 'in_' + Date.now();
  const outName = 'out_' + Date.now() + '.mp4';

  try {
    await ensureFFmpegLoaded();
    if (cancelled) return;

    progressLabel.textContent = 'Preparing…';
    await ffmpeg.writeFile(inName, await fetchFile(inputFile));
    if (cancelled) return;

    let args = buildArgs(inName, outName);

    // Resolve target size -> bitrate if requested
    if (targetSize.value && parseFloat(targetSize.value) > 0) {
      progressLabel.textContent = 'Reading video info…
